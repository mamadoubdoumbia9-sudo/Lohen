name: Android Emulator QA

on:
  workflow_dispatch:

concurrency:
  group: android-emulator
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0f998-lohen
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :android:assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run the game on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_xl
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/qa_playthrough.sh

      - name: Collect QA evidence
        if: always()
        run: |
          mkdir -p build-reports/qa
          cp -r /tmp/qa/* build-reports/qa/ 2>/dev/null || true
          ls -l build-reports/qa || true

      - name: Push QA evidence
        if: always()
        run: |
          git config user.name "lohen-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f build-reports/qa
          git commit -m "qa: emulator playthrough evidence [skip ci]" || echo "nothing to commit"
          git pull --rebase origin arena/01a0f998-lohen || true
          git push origin HEAD:arena/01a0f998-lohen
