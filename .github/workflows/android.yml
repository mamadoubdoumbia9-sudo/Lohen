name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ "arena/01a0f998-lohen" ]
    paths-ignore: [ "dist/**", "build-reports/**", "**/*.md" ]

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0f998-lohen
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests (core game logic)
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :core:test --no-daemon --stacktrace 2>&1 | tee /tmp/tests.log

      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :android:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Collect report
        if: always()
        run: |
          mkdir -p build-reports dist
          { 
            echo "# Build report"
            echo "date: $(date -u)"
            echo "commit: $GITHUB_SHA"
            echo "tests_outcome: ${{ steps.tests.outcome }}"
            echo "assemble_outcome: ${{ steps.assemble.outcome }}"
            echo
            echo "## tests.log (tail)"; tail -n 120 /tmp/tests.log 2>/dev/null || echo none
            echo
            echo "## build.log (tail)"; tail -n 200 /tmp/build.log 2>/dev/null || echo none
            echo
            echo "## apk"
            ls -l android/build/outputs/apk/debug/ 2>/dev/null || echo "no apk dir"
          } > build-reports/last-build.md
          if [ -f android/build/outputs/apk/debug/android-debug.apk ]; then
            cp android/build/outputs/apk/debug/android-debug.apk dist/PourLohen-debug.apk
            sha256sum dist/PourLohen-debug.apk >> build-reports/last-build.md
            du -h dist/PourLohen-debug.apk >> build-reports/last-build.md
          fi

      - name: Push results back to branch
        if: always()
        run: |
          git config user.name "lohen-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f build-reports dist 2>/dev/null || true
          git commit -m "ci: build report [skip ci]" || echo "nothing to commit"
          git pull --rebase origin arena/01a0f998-lohen || true
          git push origin HEAD:arena/01a0f998-lohen
